<script>
let token = localStorage.getItem('sv_token');
let currentUser = null;
let authMode = 'login';
let socket = null;
let currentChatContact = null;
let currentProfileId = null;
let searchTabData = { users: [], posts: [], hashtags: [] };
let activeSearchTab = 'users';

// ==== End-to-end encryption (Web Crypto API: ECDH P-256 + AES-GCM) ====
// How it works: each device generates its own ECDH key pair. The PUBLIC key
// is uploaded to the server so other people can find it. The PRIVATE key
// never leaves this browser - it's kept in localStorage on this device only.
// To message someone, we combine OUR private key with THEIR public key via
// ECDH, which produces the exact same shared secret they get by combining
// THEIR private key with OUR public key. That shared secret becomes an
// AES-GCM key used to encrypt/decrypt - the server only ever sees ciphertext.
const sharedKeyCache = {}; // userId -> CryptoKey, cached per session to avoid re-deriving every message

async function getOrCreateMyKeyPair(){
    const storedPrivate = localStorage.getItem('sv_privkey_jwk');
    const storedPublic = localStorage.getItem('sv_pubkey_jwk');
    if (storedPrivate && storedPublic) {
        const privateKey = await crypto.subtle.importKey('jwk', JSON.parse(storedPrivate), { name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey']);
        return { privateKey, publicJwk: JSON.parse(storedPublic) };
    }
    const keyPair = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey']);
    const privateJwk = await crypto.subtle.exportKey('jwk', keyPair.privateKey);
    const publicJwk = await crypto.subtle.exportKey('jwk', keyPair.publicKey);
    localStorage.setItem('sv_privkey_jwk', JSON.stringify(privateJwk));
    localStorage.setItem('sv_pubkey_jwk', JSON.stringify(publicJwk));
    return { privateKey: keyPair.privateKey, publicJwk };
}

async function publishMyPublicKey(){
    const { publicJwk } = await getOrCreateMyKeyPair();
    await api('/api/users/me/public-key', { method: 'PUT', body: JSON.stringify({ public_key: JSON.stringify(publicJwk) }) });
}

async function getSharedKeyWith(otherUserId){
    if (sharedKeyCache[otherUserId]) return sharedKeyCache[otherUserId];
    const { privateKey } = await getOrCreateMyKeyPair();
    const data = await api(`/api/users/${otherUserId}/public-key`);
    if (!data.public_key) throw new Error("This person hasn't set up secure messaging yet");
    const theirPublicKey = await crypto.subtle.importKey('jwk', JSON.parse(data.public_key), { name: 'ECDH', namedCurve: 'P-256' }, true, []);
    const sharedKey = await crypto.subtle.deriveKey(
        { name: 'ECDH', public: theirPublicKey },
        privateKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
    );
    sharedKeyCache[otherUserId] = sharedKey;
    return sharedKey;
}

function bufToBase64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function base64ToBuf(b64){ return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }

async function encryptForContact(otherUserId, plaintext){
    const key = await getSharedKeyWith(otherUserId);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const encoded = new TextEncoder().encode(plaintext);
    const ciphertextBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);
    return { ciphertext: bufToBase64(ciphertextBuf), iv: bufToBase64(iv) };
}

async function decryptFromContact(otherUserId, ciphertextB64, ivB64){
    try {
        const key = await getSharedKeyWith(otherUserId);
        const plaintextBuf = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: base64ToBuf(ivB64) },
            key,
            base64ToBuf(ciphertextB64)
        );
        return new TextDecoder().decode(plaintextBuf);
    } catch (err) {
        return '[Could not decrypt this message]';
    }
}
// ==== end E2EE engine ====


function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str||''; return d.innerHTML; }

function showToast(msg, type='success'){
    const colors = { success:'#10b981', error:'#ef4444', info:'#4F46E5' };
    const el = document.createElement('div');
    el.className = 'notification-toast';
    el.style.background = colors[type] || colors.info;
    el.textContent = msg;
    document.getElementById('toastRoot').appendChild(el);
    requestAnimationFrame(()=>el.classList.add('show'));
    setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),300); }, 3000);
}

function switchPage(name){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(name+'Page').classList.add('active');
}
function showFeed(){ switchPage('feed'); loadFeed(); }
function focusComposer(){
    if (!currentUser) return openModal('authModal');
    showFeed();
    setTimeout(() => document.getElementById('newPostText').focus(), 100);
}

async function api(path, options={}) {
    const headers = { 'Content-Type': 'application/json', ...(options.headers||{}) };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(path, { ...options, headers });
    const data = await res.json().catch(()=>({}));
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
}
async function apiForm(path, formData, method='POST') {
    const headers = {};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(path, { method, headers, body: formData });
    const data = await res.json().catch(()=>({}));
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
}

// ---- Auth ----
function toggleAuthMode(){
    authMode = authMode === 'login' ? 'signup' : 'login';
    document.getElementById('authTitle').textContent = authMode === 'login' ? 'Sign In' : 'Create Account';
    document.getElementById('authSubmitBtn').textContent = authMode === 'login' ? 'Sign In' : 'Sign Up';
    document.getElementById('signupNameField').classList.toggle('hidden', authMode !== 'signup');
    document.getElementById('authToggleText').textContent = authMode === 'login' ? "Don't have an account?" : 'Already have an account?';
    document.getElementById('authToggleLink').textContent = authMode === 'login' ? 'Sign up' : 'Sign in';
}

async function submitAuth(){
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const name = document.getElementById('authName').value.trim();
    try {
        const payload = authMode === 'login' ? { email, password } : { name, email, password };
        const data = await api('/api/auth/' + authMode, { method: 'POST', body: JSON.stringify(payload) });
        token = data.token;
        localStorage.setItem('sv_token', token);
        currentUser = data.user;
        closeModal('authModal');
        onAuthed();
        showToast('Welcome, ' + currentUser.name + '!');
    } catch (err) { showToast(err.message, 'error'); }
}

function onAuthed(){
    document.getElementById('signInBtn').outerHTML = `
        <div class="avatar w-9 h-9 text-sm cursor-pointer" id="myAvatarBtn" onclick="viewProfile(${currentUser.id})">
            ${currentUser.name.charAt(0).toUpperCase()}
        </div>`;
    document.getElementById('composer').classList.remove('hidden');
    document.getElementById('signedOutNotice').classList.add('hidden');
    publishMyPublicKey().catch(() => showToast('Could not set up secure messaging', 'error'));
    connectChat();
    loadFeed();
    pollNotifications();
    setInterval(pollNotifications, 20000);
}

async function tryRestoreSession(){
    if (!token) return loadFeed();
    try {
        const data = await api('/api/auth/me');
        currentUser = data.user;
        onAuthed();
    } catch {
        token = null; localStorage.removeItem('sv_token');
        loadFeed();
    }
}

// ---- Feed ----
async function loadFeed(){
    try {
        const data = await api('/api/posts');
        renderPostList(data.posts, 'postsContainer');
        loadStories();
    } catch { showToast('Could not load feed', 'error'); }
}

function linkify(text){
    return escapeHtml(text).replace(/#(\w+)/g, '<span class="hashtag" onclick="viewHashtag(\'$1\')">#$1</span>');
}

function renderPostCard(p){
    const isRepost = !!p.repost_of;
    const original = p.original_post;
    return `
        <div class="bg-white rounded-2xl shadow-lg p-5">

function handleComposerFileChange(){
    const file = document.getElementById('newPostMedia').files[0];
    const wrap = document.getElementById('reelCheckboxWrap');
    if (file && file.type.startsWith('video/')) {
        wrap.classList.remove('hidden'); wrap.classList.add('flex');
    } else {
        wrap.classList.add('hidden'); wrap.classList.remove('flex');
        document.getElementById('postAsReel').checked = false;
    }
}

async function createPost(){
    if (!currentUser) return openModal('authModal');
    const text = document.getElementById('newPostText').value.trim();
    const fileInput = document.getElementById('newPostMedia');
    const file = fileInput.files[0];
    const isReel = document.getElementById('postAsReel').checked;
    if (!text && !file) return showToast('Write something or add media', 'error');
    try {
        const form = new FormData();
        if (text) form.append('text', text);
        if (file) form.append('media', file);
        if (isReel) form.append('is_reel', 'true');
        await apiForm('/api/posts', form);
        document.getElementById('newPostText').value = '';
        fileInput.value = '';
        document.getElementById('postAsReel').checked = false;
        document.getElementById('reelCheckboxWrap').classList.add('hidden');
        showToast(isReel ? 'Reel posted!' : 'Posted!');
        loadFeed();
    } catch (err) { showToast(err.message, 'error'); }
}

async function viewProfile(userId){
    currentProfileId = userId;
    switchPage('profile');
    try {
        const data = await api(`/api/users/${userId}`);
        const u = data.user;
        document.getElementById('profileCover').src = u.cover_photo_url || 'https://placehold.co/600x160/4F46E5/FFFFFF?text=';
        document.getElementById('profileAvatarWrap').innerHTML = u.avatar_url ? `<img src="${u.avatar_url}" class="w-full h-full rounded-full object-cover">` : u.name.charAt(0).toUpperCase();
        document.getElementById('profileName').innerHTML = `${escapeHtml(u.name)} ${u.is_verified ? '<i class="fas fa-badge-check text-primary text-lg"></i>' : ''} ${u.is_private ? '<i class="fas fa-lock text-gray-400 text-sm"></i>' : ''}`;
        document.getElementById('profileBio').textContent = u.bio || '';
        document.getElementById('followerCount').textContent = data.follower_count;
        document.getElementById('followingCount').textContent = data.following_count;
        renderPostList(data.posts.map(p => ({ ...p, author_id: u.id, author_name: u.name, author_avatar: u.avatar_url, is_verified: u.is_verified, comments: p.comments || [] })), 'profilePosts');

        const actionsEl = document.getElementById('profileActionButtons');
        if (currentUser && currentUser.id === u.id) {
            actionsEl.innerHTML = `<button onclick="openEditProfile()" class="border-2 border-primary text-primary px-4 py-2 rounded-full text-sm font-medium">Edit Profile</button>`;
        } else if (currentUser) {

            actionsEl.innerHTML = renderFollowButton(userId, statusData.status);
        } else {
            actionsEl.innerHTML = '';
        }
    } catch (err) { showToast(err.message, 'error'); }
}

function renderFollowButton(userId, status){
    const map = {
        following: { label: 'Following', cls: 'bg-gray-200 text-gray-700' },
        requested: { label: 'Requested', cls: 'bg-gray-200 text-gray-700' },

    return `<button onclick="toggleFollow(${userId})" class="${s.cls} px-5 py-2 rounded-full text-sm font-bold">${s.label}</button>`;

// ---- Stories ----
let storiesGrouped = [];
let storyViewerState = { authorIndex: 0, storyIndex: 0, timer: null };

async function loadStories(){
    try {
        const data = await api('/api/stories');
        const groups = {};
        for (const s of data.stories) {
            if (!groups[s.author_id]) groups[s.author_id] = { author_id: s.author_id, author_name: s.author_name, author_avatar: s.author_avatar, stories: [] };
            groups[s.author_id].stories.push(s);
        }
        storiesGrouped = Object.values(groups);
        renderStoriesBar();
    } catch { /* stories are non-critical, fail silently */ }
}

function renderStoriesBar(){
    const bar = document.getElementById('storiesBar');
    let html = '';
    if (currentUser) {
        const mine = storiesGrouped.find(g => g.author_id === currentUser.id);
        html += `
            <div class="story-circle" onclick="${mine ? `openStoryViewer(${storiesGrouped.indexOf(mine)})` : "document.getElementById('storyFileInput').click()"}">
                <div class="story-ring ${mine ? '' : 'own'}">
                    <div class="story-ring-inner">
                        <div class="avatar w-full h-full text-sm">${currentUser.name.charAt(0).toUpperCase()}</div>
                    </div>
                </div>
                <p class="text-xs mt-1 truncate">${mine ? 'Your Story' : 'Add Story'}</p>
            </div>`;
    }
    storiesGrouped.forEach((g, idx) => {
        if (currentUser && g.author_id === currentUser.id) return; // already shown above
        html += `
            <div class="story-circle" onclick="openStoryViewer(${idx})">
                <div class="story-ring">
                    <div class="story-ring-inner">
                        <div class="avatar w-full h-full text-sm">${escapeHtml(g.author_name).charAt(0).toUpperCase()}</div>
                    </div>
                </div>
                <p class="text-xs mt-1 truncate">${escapeHtml(g.author_name)}</p>
            </div>`;
    });
    bar.innerHTML = html;
}

async function uploadStory(){
    const file = document.getElementById('storyFileInput').files[0];
    if (!file || !currentUser) return;
    try {
        const form = new FormData();
        form.append('media', file);
        await apiForm('/api/stories', form);
        showToast('Story posted! It disappears in 24 hours.');
        document.getElementById('storyFileInput').value = '';
        loadStories();
    } catch (err) { showToast(err.message, 'error'); }
}

function openStoryViewer(authorIndex){
    storyViewerState.authorIndex = authorIndex;
    storyViewerState.storyIndex = 0;
    document.getElementById('storyViewerOverlay').classList.add('show');
    renderCurrentStory();
}

function closeStoryViewer(){
    clearTimeout(storyViewerState.timer);
    document.getElementById('storyViewerOverlay').classList.remove('show');
    document.getElementById('storyMediaWrap').innerHTML = '';
}

function renderCurrentStory(){
    clearTimeout(storyViewerState.timer);
    const group = storiesGrouped[storyViewerState.authorIndex];
    if (!group) return closeStoryViewer();
    const story = group.stories[storyViewerState.storyIndex];
    if (!story) return closeStoryViewer();

    document.getElementById('storyViewerAvatar').textContent = group.author_name.charAt(0).toUpperCase();
    document.getElementById('storyViewerName').textContent = group.author_name;

    const wrap = document.getElementById('storyMediaWrap');
    if (story.media_type === 'video') {
        wrap.innerHTML = `<video src="${story.media_url}" class="max-h-full max-w-full" autoplay playsinline onended="advanceStory()"></video>`;
    } else {
        wrap.innerHTML = `<img src="${story.media_url}" class="max-h-full max-w-full object-contain">`;
        const fill = document.getElementById('storyProgressFill');
        fill.style.transition = 'none'; fill.style.width = '0%';
        requestAnimationFrame(() => { fill.style.transition = 'width 5s linear'; fill.style.width = '100%'; });
        storyViewerState.timer = setTimeout(advanceStory, 5000);
    }
}

function advanceStory(){
    const group = storiesGrouped[storyViewerState.authorIndex];
    if (storyViewerState.storyIndex < group.stories.length - 1) {
        storyViewerState.storyIndex++;
    } else if (storyViewerState.authorIndex < storiesGrouped.length - 1) {
        storyViewerState.authorIndex++;
        storyViewerState.storyIndex = 0;
    } else {
        return closeStoryViewer();
    }
    renderCurrentStory();
}

function goBackStory(){
    if (storyViewerState.storyIndex > 0) {
        storyViewerState.storyIndex--;
    } else if (storyViewerState.authorIndex > 0) {
        storyViewerState.authorIndex--;
        storyViewerState.storyIndex = storiesGrouped[storyViewerState.authorIndex].stories.length - 1;
    } else {
        return;
    }
    renderCurrentStory();
}

function handleStoryTap(event){
    const isRightSide = event.clientX > window.innerWidth / 2;
    if (isRightSide) advanceStory(); else goBackStory();
}

function showChatContactList(){

let chatSearchTimeout = null;
function searchChatContacts(query){
    clearTimeout(chatSearchTimeout);
    const resultsEl = document.getElementById('chatSearchResults');
    if (!query.trim()) { resultsEl.innerHTML = ''; return; }
    chatSearchTimeout = setTimeout(async () => {
        try {
            const data = await api('/api/search?q=' + encodeURIComponent(query));
            resultsEl.innerHTML = (data.users || []).filter(u => u.id !== currentUser.id).map(u => `
                <div class="contact-row" onclick="openConversation(${u.id}, '${escapeHtml(u.name).replace(/'/g,"\\'")}')">
                    <div class="avatar w-9 h-9 text-sm">${escapeHtml(u.name).charAt(0).toUpperCase()}</div>
                    <span class="font-medium text-sm">${escapeHtml(u.name)}</span>
                </div>
            `).join('') || '<p class="text-center text-gray-400 p-3 text-xs">No matching people.</p>';
        } catch {}
    }, 300);
}

async function openConversation(userId, name){
    if (!currentUser) return openModal('authModal');
    currentChatContact = userId;
    document.getElementById('chatContactList').style.display = 'none';
    document.getElementById('chatConversation').style.display = 'flex';
    document.getElementById('chatBackBtn').classList.remove('hidden');
    document.getElementById('chatHeaderTitle').innerHTML = `${escapeHtml(name)} <i class="fas fa-lock text-xs ml-1" title="End-to-end encrypted"></i>`;
    const wrap = document.getElementById('chatMessages');
    wrap.innerHTML = '<p class="text-center text-gray-400 text-sm py-4">Decrypting messages...</p>';
    try {
        const data = await api(`/api/messages/with/${userId}`);
        wrap.innerHTML = '';
        for (const msg of data.messages) {
            const otherParty = msg.sender_id === currentUser.id ? msg.recipient_id : msg.sender_id;
            const plaintext = await decryptFromContact(otherParty, msg.ciphertext, msg.iv);
            appendChatMessage(plaintext, msg.sender_id === currentUser.id ? 'sent' : 'received');
        }
    } catch (err) {
        wrap.innerHTML = `<p class="text-center text-gray-400 text-sm py-4">${escapeHtml(err.message)}</p>`;
    }
}

function connectChat(){
    socket = io({ auth: { token } });
    socket.on('direct_message', async (msg) => {
        const relevant = (msg.sender_id === currentChatContact) || (msg.sender_id === currentUser.id && msg.recipient_id === currentChatContact);
        if (relevant) {
            const otherParty = msg.sender_id === currentUser.id ? msg.recipient_id : msg.sender_id;
            const plaintext = await decryptFromContact(otherParty, msg.ciphertext, msg.iv);
            const kind = msg.sender_id === currentUser.id ? 'sent' : 'received';
            appendChatMessage(plaintext, kind);
        }
    });
}

function appendChatMessage(text, kind){
    const wrap = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'message';
    div.innerHTML = `<div class="${kind}">${escapeHtml(text)}</div>`;
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
}

async function sendChatMessage(){
    if (!currentChatContact) return;
    const input = document.getElementById('chatInputField');
    const text = input.value.trim();
    if (!text) return;
    try {
        const { ciphertext, iv } = await encryptForContact(currentChatContact, text);
        socket.emit('direct_message', { recipientId: currentChatContact, ciphertext, iv });
        input.value = '';
    } catch (err) {
        showToast(err.message, 'error');
    }
}

tryRestoreSession();
</script>
